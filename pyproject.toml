[project]
name = "org.casavant.jeff.twilio"
version = "0.2.0rc1"
description = "Maubot plugin to bridge rooms to SMS using Twilio"
authors = [{ name = "Jeff Casavant", email = "jeff.casavant@gmail.com" }]
license = "MIT"
requires-python = ">=3.11,<4"
dependencies = [
    "maubot[legacydb] (>=0.6.0,<0.7.0)",
    "mautrix (>=0.21.0,<0.22.0)",
    "twilio (>=9.13.0,<10.0.0)",
    # asyncpg is a transitive dep, but before this version has an invalid pyproject.toml
    "asyncpg (>=0.26.0)",
]

[tool.poetry.group.dev.dependencies]
bandit = "^1.9.4"
black = "^26.10.1"
pip-audit = "^2.10.1"
pylint = "^4.1.3"
isort = "^9.0.2"
"ruamel.yaml" = "^0.18.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint."MESSAGES_CONTROL"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-locals",
    "too-many-statements"
]

[tool.pylint."FORMAT"]
max-line-length = 120

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.maubot]
maubot = "0.1.0"
modules = ["twilio_plugin"]
main_class = "TwilioPlugin"
database = true
webapp = true
extra_files = [
  "base-config.yaml",
]
