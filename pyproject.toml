[tool.poetry]
name = "org.casavant.jeff.twilio"
version = "0.2.0rc1"
description = "Maubot plugin to bridge rooms to SMS using Twilio"
authors = ["Jeff Casavant <jeff.casavant@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
maubot = "^0.6.0"
mautrix = "^0.21.0"
twilio = "^7.9.2"
# asyncpg is a transitive dep, but before this version has an invalid pyproject.toml
asyncpg = ">=0.26.0"

[tool.poetry.dev-dependencies]
bandit = "^1.7.0"
black = "^26.10.1"
safety = "^1.10.3"
pylint = "^4.0.9"
isort = "^5.9.3"
toml = "^0.10.2"
"ruamel.yaml" = "^0.17.16"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint."MESSAGES_CONTROL"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-locals",
    "too-many-statements"
]

[tool.pylint."FORMAT"]
max-line-length = 120

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.maubot]
maubot = "0.1.0"
modules = ["twilio_plugin"]
main_class = "TwilioPlugin"
database = true
webapp = true
extra_files = [
  "base-config.yaml",
]
